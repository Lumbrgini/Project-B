name: Run Unit Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - release/*
      - feature/*
      - hotfix/*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: server
        run: npm install

      - name: Run tests
        working-directory: server
        run: npm t
